name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: orchestrator_source
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: PostgreSQL queue and migration (mandatory)
        env:
          TEST_JOB_DATABASE_URL: postgresql+psycopg2://postgres:isolated-ci@127.0.0.1:5432/orchestrator_source
          TEST_TRANSFER_DATABASE_URL: postgresql+psycopg2://postgres:isolated-ci@127.0.0.1:5432/orchestrator_target
          PGPASSWORD: isolated-ci
        run: |
          createdb -h 127.0.0.1 -U postgres orchestrator_target
          pytest tests/test_database_transfer.py tests/test_postgres_store.py

  docker:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      DEFAULT_IMAGE_NAME: calof/job_orchestrator_agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: |
          IMAGE="${IMAGE_NAME:-$DEFAULT_IMAGE_NAME}"
          docker build -t ${IMAGE}:${{ github.sha }} .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
      - name: Push image
        run: |
          IMAGE="${IMAGE_NAME:-$DEFAULT_IMAGE_NAME}"
          docker push ${IMAGE}:${{ github.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:latest
            docker push ${IMAGE}:latest
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:${{ github.ref_name }}
            docker push ${IMAGE}:${{ github.ref_name }}
          fi
